<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive Ticketjack demo for entrants, organizers, and administrators.">
  <meta name="theme-color" content="#17191c">
  <title>Ticketjack — Interactive Demo</title>
  <link rel="icon" href="ticketjack-mark.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#demo-main">Skip to demo</a>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Ticketjack demo home">
        <img src="ticketjack-mark.png" alt="">
        <span>Ticketjack</span>
        <small>interactive demo</small>
      </a>
      <div class="topbar-actions">
        <span class="local-state"><span aria-hidden="true"></span> Browser-local demo</span>
        <button class="icon-action" id="reset-demo" type="button" title="Reset demo data">Reset</button>
        <a class="icon-action" href="https://github.com/Aaryan-MK7/Ticketjack">Source ↗</a>
      </div>
    </header>
    <section class="role-switcher" aria-label="Demo role">
      <div>
        <span class="role-label">Explore as</span>
        <div class="role-tabs" role="tablist" aria-label="Application role">
          <button data-role="entrant" role="tab" type="button">Entrant</button>
          <button data-role="organizer" role="tab" type="button">Organizer</button>
          <button data-role="admin" role="tab" type="button">Administrator</button>
        </div>
      </div>
      <p id="role-context"></p>
    </section>
    <div class="workspace">
      <aside class="sidebar" aria-label="Application navigation">
        <div class="profile-chip" id="profile-chip"></div>
        <nav id="app-navigation"></nav>
        <div class="sidebar-note">
          <strong>Safe demo mode</strong>
          <span>Actions update only this browser. Reset at any time.</span>
        </div>
      </aside>
      <main id="demo-main" tabindex="-1">
        <div id="app-view" aria-live="polite"></div>
      </main>
    </div>
  </div>
  <dialog id="detail-dialog" class="detail-dialog">
    <div id="dialog-content"></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>
    <div class="noscript">Ticketjack’s interactive demo requires JavaScript.</div>
  </noscript>
  <script src="app.js" defer></script>
</body>
</html>
